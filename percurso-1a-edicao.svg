<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-label="Percurso da 1ª Corrida Everest: largada na Everest Academia, gancho de saída, 3,2 km pela Rua 4 de Outubro até o Privê Maisons de France e volta pelo mesmo trajeto">
  <title>Percurso da 1ª Corrida Everest — 6,4 km ida e volta</title>
